{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio - Sistema Paulina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="home-page">
    <nav class="topbar">
        <div class="brand">Almacén Paulina</div>
        {% if puede_crear_usuarios %}
            <a class="btn btn-light" href="{% url 'nuevo_usuario' %}">
                Agregar usuario
            </a>
        {% endif %}

        <form action="{% url 'logout' %}" method="post" class="logout-form">
            {% csrf_token %}
            <button class="logout-btn" type="submit">
                Cerrar sesión ({{ usuario.username }})
            </button>
        </form>
    </nav>

    <main class="dashboard">
        <div class="module-card">
            <div class="module-header">
                <span class="module-icon">🛒</span>
                <h3>Punto de Venta</h3>
            </div>
            <a class="module-status status-green text-center text-decoration-none"
               href="{% url 'caja' %}">
                Abrir punto de venta
            </a>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-icon">📦</span>
                <h3>Inventario</h3>
            </div>
            <a class="module-status status-blue text-center text-decoration-none"
               href="{% url 'inventario' %}">
                Abrir inventario
            </a>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-icon">🚚</span>
                <h3>Proveedores</h3>
            </div>
            <a class="module-status status-blue text-center text-decoration-none"
               href="{% url 'proveedores' %}">
                Gestionar proveedores
            </a>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-icon">📥</span>
                <h3>Ingreso Mercadería</h3>
            </div>
            <a class="module-status status-green text-center text-decoration-none"
               href="{% url 'nuevo_ingreso' %}">
                Registrar factura
            </a>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-icon">📊</span>
                <h3>Reportes</h3>
            </div>
            <button class="module-status status-yellow" disabled>
                Módulo en desarrollo
            </button>
        </div>
    </main>
</body>
</html>
