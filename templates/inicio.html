{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio - Sistema Paulina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="home-page">
    <nav class="topbar">
        <div class="brand">Almacén Paulina</div>
        <form action="{% url 'logout' %}" method="post" class="logout-form">
            {% csrf_token %}
            <button class="logout-btn" type="submit">Cerrar sesión ({{ user.username }})</button>
        </form>
    </nav>

    <main class="dashboard">
        <div class="module-card">
            <div class="module-header">
                <span class="module-icon">🛒</span>
                <h3>Punto de Venta</h3>
            </div>
            <button class="module-status status-green" disabled>Módulo en desarrollo</button>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-icon">📦</span>
                <h3>Inventario</h3>
            </div>
            <button class="module-status status-blue" disabled>Módulo en desarrollo</button>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="module-icon">📊</span>
                <h3>Reportes</h3>
            </div>
            <button class="module-status status-yellow" disabled>Módulo en desarrollo</button>
        </div>
    </main>
</body>
</html>
